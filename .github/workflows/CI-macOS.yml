name: CI-macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_26.5.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Prepare Simulator
      run: |
        # 1. Disable hardware keyboard to avoid focus issues during text entry
        defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

        # 2. Pre-boot the target simulator and block until SpringBoard is ready
        xcrun simctl boot "iPhone 17" || true
        xcrun simctl bootstatus "iPhone 17" -b

    - name: Build and Test iOS
      run: |
        set -o pipefail
        xcodebuild test \
          -workspace SocialFeed.xcworkspace \
          -scheme "CI_iOS" \
          -sdk iphonesimulator \
          -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
          -enableThreadSanitizer NO \
          -disable-concurrent-destination-testing \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=YES